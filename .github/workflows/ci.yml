name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Verify committed extension build
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            echo "The committed dist/ extension is out of date. Run npm run build and commit the updated dist/ files."
            git status --short --untracked-files=all -- dist
            exit 1
          fi
